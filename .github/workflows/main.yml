name: main

# Третий уровень (§8 CLAUDE.md): сквозной прогон на поднятом окружении.
on:
  push:
    branches: [main]

concurrency:
  group: main
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: compose up
        run: |
          cp .env.example .env
          docker compose up -d --build --wait

      - name: smoke
        env:
          E2E_API_KEY: local-dev-key
        run: uv run pytest -m e2e

      - name: logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: compose down
        if: always()
        run: docker compose down -v
