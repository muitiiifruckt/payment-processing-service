[project]
name = "payment-processing-service"
version = "0.1.0"
description = "Асинхронный сервис процессинга платежей"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    # 0.7 удалил retry/no_ack/ack_first и переключил очереди на durable по умолчанию —
    # пин обязателен, код написан под этот API
    "faststream[cli,rabbit]>=0.7,<0.8",
    "httpx>=0.28",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-randomly>=3.15",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "testcontainers[postgres,rabbitmq]>=4.9",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# --- pytest ---------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Контейнер и движок живут на всю сессию, значит и цикл событий тоже — иначе
# соединение asyncpg, созданное на одном цикле, используется на другом.
# Область у фикстур и у тестов обязана совпадать.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: требует реальных Postgres / RabbitMQ / HTTP",
    "e2e: требует поднятого окружения целиком",
]
addopts = "--strict-markers --strict-config"

# --- ruff -----------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "RUF",
]
ignore = [
    # Комментарии и docstring на русском: правила про «неоднозначные» кириллические
    # символы рассчитаны на кодовую базу, где кириллица — признак подмены символов
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

# --- mypy -----------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

# Ядро проверяется строго, инфраструктура — нет: там чужие типы,
# и строгость выродилась бы в игнорирование
[[tool.mypy.overrides]]
module = ["app.domain.*", "app.application.*"]
strict = true
