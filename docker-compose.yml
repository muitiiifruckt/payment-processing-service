services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # -U и -d обязательны: без них проба зелёная ещё на временном экземпляре инициализации
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:?нужен в .env}
      RABBITMQ_URL: ${RABBITMQ_URL:?нужен в .env}
      API_KEY: ${API_KEY:?нужен в .env}
      ENABLE_WEBHOOK_SINK: ${ENABLE_WEBHOOK_SINK:-false}
      WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-api}
      GATEWAY_FORCE_OUTCOME: ${GATEWAY_FORCE_OUTCOME:-}
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # накат миграций здесь и только здесь: consumer ждёт /health, вторая гонка на схему не нужна
    # exec, иначе PID 1 остаётся sh и SIGTERM до uvicorn не доходит:
    # остановка ждёт весь stop_grace_period и бьёт по живым запросам
    command: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 30s

  consumer:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:?нужен в .env}
      RABBITMQ_URL: ${RABBITMQ_URL:?нужен в .env}
      API_KEY: ${API_KEY:?нужен в .env}
      ENABLE_WEBHOOK_SINK: ${ENABLE_WEBHOOK_SINK:-false}
      WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-api}
      GATEWAY_FORCE_OUTCOME: ${GATEWAY_FORCE_OUTCOME:-}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_healthy
    command: faststream run app.presentation.consumer:create_app --factory
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  postgres_data:
